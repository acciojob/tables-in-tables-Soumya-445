<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Table</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <table class="main-table">
    <tr>
      <td>
        <!-- Nested Table 1 -->
        <table class="nested-table">
          <tr>
            <th colspan="2">Nested Table 1</th>
          </tr>
          <tr>
            <td>Column 1</td>
            <td>Column 2</td>
          </tr>
        </table>
      </td>

      <td>
        <!-- Nested Table 2 -->
        <table class="nested-table">
          <tr>
            <th colspan="2">Nested Table 2</th>
          </tr>
          <tr>
            <td>Column 1</td>
            <td>Column 2</td>
          </tr>
        </table>
      </td>
    </tr>

    <tr>
      <td>
        <!-- Nested Table 3 -->
        <table class="nested-table">
          <tr>
            <th>Nested Table 3</th>
          </tr>
          <tr>
            <td>
              <ul>
                <li>List item 1</li>
                <li>List item 2</li>
                <li>List item 3</li>
              </ul>
            </td>
          </tr>
        </table>
      </td>

      <td>
        <!-- Nested Table 4 -->
        <table class="nested-table">
          <tr>
            <th>Nested Table 4</th>
          </tr>
          <tr>
            <td class="html-cell">HTML</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
